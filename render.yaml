services:
  - type: web
    name: archsync-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start -w @archsync/server
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false # Set in Render Dashboard: e.g. https://archsync.vercel.app
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: e.g. mongodb+srv://...
      - key: JWT_SECRET
        generateValue: true # Generates secure 32+ character secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: auth_token
      - key: COOKIE_SAME_SITE
        value: none # Required for cross-site Vercel <-> Render cookie transport
      - key: TRUST_PROXY
        value: "true"
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard if AI assistance is enabled
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
